[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "flybrain-ss13"
version = "1.0.0"
description = "Цифровой двойник мозга дрозофилы за рулём персонажа в Space Station 13"
requires-python = ">=3.9"
dependencies = ["numpy>=1.21"]

[project.optional-dependencies]
# нужны только для разовой сборки коннектома из CSV
build = ["pandas>=1.3"]
# ускорение движка на GPU
gpu = ["torch>=2.0"]

[project.scripts]
flybrain-server = "flybrain.server:main"

[tool.setuptools.packages.find]
include = ["flybrain*"]

[tool.setuptools.package-data]
flybrain = ["viz/*.html"]
